spring.application.name=AlimentaRed
server.port=${PORT:8080}

# --- Base de datos (PostgreSQL en Supabase - Session Pooler IPv4) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.icnpffaunpbfjlkgctjj}
spring.datasource.password=${DB_PASSWORD:aaqDtl1xnNsFHCkr}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Optimizaciones HikariCP para Pooler de Supabase (Evitar desconexiones por idle/timeout) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=15000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Seguridad JWT ---
alimentared.jwt.secret=${JWT_SECRET:Y2FtYmlhci1lc3RhLWNsYXZlLWVuLXByb2R1Y2Npb24tYWxpbWVudGFyZWQtMjAyNg==}
alimentared.jwt.expiracion-minutos=60

# --- Parámetros de reglas de negocio ---
alimentared.zona-horaria=America/Bogota
alimentared.reglas.max-solicitudes-activas=3
alimentared.reglas.max-strikes=3
alimentared.reglas.sla-confirmacion-minutos=60
alimentared.reglas.ventana-empate-segundos=60
alimentared.reglas.horas-limite-retiro=24
alimentared.reglas.horas-rescate-urgente=4

# --- Tareas programadas ---
alimentared.scheduling.enabled=true
alimentared.cron.empate=*/10 * * * * *
alimentared.cron.sla=0 * * * * *
alimentared.cron.vencimientos=0 */5 * * * *

# --- Datos iniciales ---
alimentared.seed.habilitado=true
alimentared.seed.admin-correo=${ADMIN_EMAIL:admin@alimentared.com}
alimentared.seed.admin-contrasena=${ADMIN_PASSWORD:Admin12345}
alimentared.seed.coordinador-correo=${COORDINADOR_EMAIL:coordinador@alimentared.com}
alimentared.seed.coordinador-contrasena=${COORDINADOR_PASSWORD:Coord12345}

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
